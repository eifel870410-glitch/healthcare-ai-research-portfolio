<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare AI and human factors research portfolio</title>
  <desc id="desc">Four research areas connect to a central focus on evidence, workflow, trust, and privacy.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2942"/>
      <stop offset="1" stop-color="#174f5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54d2b3"/>
      <stop offset="1" stop-color="#75b7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00111f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <circle cx="1075" cy="65" r="145" fill="#ffffff" opacity="0.04"/>
  <circle cx="80" cy="480" r="180" fill="#54d2b3" opacity="0.07"/>

  <text x="72" y="82" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="2">RESEARCH PORTFOLIO</text>
  <text x="72" y="137" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Healthcare AI as a human system</text>
  <text x="72" y="176" fill="#cae4ed" font-family="Segoe UI, Arial, sans-serif" font-size="21">Designing for safe decisions, understandable evidence, and responsible workflow integration</text>

  <g stroke="#86d8d1" stroke-width="3" opacity="0.55" fill="none">
    <path d="M304 292 C430 292 458 345 520 345"/>
    <path d="M304 408 C430 408 458 355 520 355"/>
    <path d="M896 292 C770 292 742 345 680 345"/>
    <path d="M896 408 C770 408 742 355 680 355"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="62" y="238" width="242" height="100" rx="20" fill="#f6fbfd"/>
    <circle cx="102" cy="288" r="22" fill="#50bfa6"/>
    <path d="M92 288 h20 M102 278 v20" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="137" y="282" fill="#12334a" font-size="20" font-weight="700">Patient</text>
    <text x="137" y="308" fill="#436475" font-size="18">communication</text>

    <rect x="62" y="356" width="242" height="100" rx="20" fill="#f6fbfd"/>
    <circle cx="102" cy="406" r="22" fill="#5aa7e8"/>
    <rect x="91" y="395" width="22" height="22" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M96 411 l5-6 4 4 4-7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="137" y="400" fill="#12334a" font-size="20" font-weight="700">Medical</text>
    <text x="137" y="426" fill="#436475" font-size="18">imaging</text>

    <rect x="896" y="238" width="242" height="100" rx="20" fill="#f6fbfd"/>
    <circle cx="936" cy="288" r="22" fill="#7b8fea"/>
    <path d="M925 297 l7-11 7 6 9-15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="971" y="282" fill="#12334a" font-size="20" font-weight="700">Clinical</text>
    <text x="971" y="308" fill="#436475" font-size="18">prediction</text>

    <rect x="896" y="356" width="242" height="100" rx="20" fill="#f6fbfd"/>
    <circle cx="936" cy="406" r="22" fill="#d28a5d"/>
    <path d="M936 393 c-8 0-12 6-12 12 0 10 12 16 12 16s12-6 12-16c0-6-4-12-12-12z" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="971" y="400" fill="#12334a" font-size="20" font-weight="700">Human factors</text>
    <text x="971" y="426" fill="#436475" font-size="18">and safety</text>

    <rect x="488" y="270" width="224" height="158" rx="79" fill="url(#accent)"/>
    <text x="600" y="324" text-anchor="middle" fill="#0b2c3a" font-size="22" font-weight="700">Evidence</text>
    <text x="600" y="355" text-anchor="middle" fill="#0b2c3a" font-size="22" font-weight="700">Workflow</text>
    <text x="600" y="386" text-anchor="middle" fill="#0b2c3a" font-size="22" font-weight="700">Trust · Privacy</text>
  </g>
</svg>

